name: Update Herdr Manifest

on:
  workflow_dispatch:
  schedule:
    - cron: "57 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-herdr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update Herdr manifest from official release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-herdr.sh

      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(bucket): update herdr to v${{ steps.update.outputs.version }}"
          title: "chore(bucket): update herdr to v${{ steps.update.outputs.version }}"
          body: |
            Automated Herdr manifest update.

            - Source: official herdrdev/herdr GitHub release
            - Updated fields: version, URL, hash
          branch: "automation/update-herdr"
          delete-branch: true
          add-paths: |
            bucket/herdr.json
