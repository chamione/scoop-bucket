name: Update Rebased Manifest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-rebased:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update Rebased manifest from official release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-rebased.sh

      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(bucket): update rebased to v${{ steps.update.outputs.version }}"
          title: "chore(bucket): update rebased to v${{ steps.update.outputs.version }}"
          body: |
            Automated Rebased manifest update.

            - Source: official DetachHead/rebased GitHub release
            - Updated fields: version, url, hash
          branch: "automation/update-rebased"
          delete-branch: true
          add-paths: |
            bucket/rebased.json
